<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Camp 26 Photo Gallery - Explore memories from Camp 26"/>
  <title>Camp 26 Gallery - Troy E. Kinney</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-toggle.css">
  <link rel="icon" type="image/svg+xml" href="media/TK.svg">
  <style>
    .gallery-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
      box-sizing: border-box;
    }

    @media (min-width: 640px) {
      .gallery-container {
        padding: 2rem;
      }
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .gallery-header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2.5rem;
    }

    .gallery-header p {
      color: #888;
      font-size: 1.1rem;
      margin: 0;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 3rem;
      width: 100%;
    }

    @media (min-width: 640px) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
      }
    }

    @media (min-width: 1024px) {
      .gallery-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
      }
    }

    @media (min-width: 1440px) {
      .gallery-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 2rem;
      }
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border: 1px solid green;
      aspect-ratio: 1;
      cursor: pointer;
      transition: all 0.3s ease;
      background-color: #111;
    }

    .gallery-item:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      animation: fadeIn 0.3s ease;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      position: relative;
      max-width: 90%;
      max-height: 90%;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-content img {
      width: 100%;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
      border: 1px solid green;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 40px;
      color: green;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .modal-close:hover {
      color: #00ff00;
    }

    .modal-nav {
      position: absolute;
      top: 50%;
      color: green;
      font-size: 30px;
      cursor: pointer;
      padding: 10px 20px;
      user-select: none;
      transition: color 0.2s ease;
    }

    .modal-nav:hover {
      color: #00ff00;
    }

    .modal-prev {
      left: 20px;
      transform: translateY(-50%);
    }

    .modal-next {
      right: 20px;
      transform: translateY(-50%);
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: green;
      font-size: 1.2rem;
    }

    .error {
      text-align: center;
      padding: 2rem;
      color: #ff6b6b;
      font-size: 1.1rem;
      border: 1px solid #ff6b6b;
      border-radius: 4px;
      margin: 1rem 0;
    }

    .back-button {
      margin-top: 2rem;
      margin-bottom: 2rem;
    }

    .back-button button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
    }

    @media (max-width: 640px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }

      .gallery-header h1 {
        font-size: 1.6rem;
      }

      .gallery-header p {
        font-size: 0.95rem;
      }

      .modal-content {
        max-width: 95%;
        max-height: 85vh;
      }

      .modal-close {
        top: 10px;
        right: 20px;
        font-size: 30px;
      }

      .modal-nav {
        padding: 5px 10px;
        font-size: 20px;
      }

      .modal-prev {
        left: 10px;
      }

      .modal-next {
        right: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="gallery-container">
      <div id="loading" class="loading">Loading images...</div>
      <div id="error" class="error" style="display: none;"></div>
      <div id="gallery" class="gallery-grid"></div>
    </div>
  </div>

  <!-- Modal for fullscreen viewing -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <span class="modal-nav modal-prev" onclick="previousImage()">&#10094;</span>
      <img id="modalImage" src="" alt="Gallery image">
      <span class="modal-nav modal-next" onclick="nextImage()">&#10095;</span>
    </div>
  </div>

  <script>
    const IMAGE_ENDPOINT = 'https://cmphts.ekinney.com';
    
    let imageUrls = [];
    let currentImageIndex = 0;

    async function loadGallery() {
      try {
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const galleryEl = document.getElementById('gallery');

        // Fetch list of images from the worker
        const response = await fetch('https://camp-gallery.722kinney.workers.dev/');
        
        if (!response.ok) {
          const errorText = await response.text();
          console.error('Worker error response:', errorText);
          throw new Error(`Failed to list images: ${response.status} ${errorText}`);
        }

        const data = await response.json();
        
        if (!data.images || data.images.length === 0) {
          throw new Error('No images found');
        }

        // Generate URLs for each image
        imageUrls = data.images.map(key => {
          return `${IMAGE_ENDPOINT}/${key}`;
        });

        if (imageUrls.length === 0) {
          throw new Error('No image files found in bucket');
        }

        loadingEl.style.display = 'none';
        galleryEl.innerHTML = '';

        // Create gallery items
        imageUrls.forEach((url, index) => {
          const item = document.createElement('div');
          item.className = 'gallery-item';
          item.onclick = () => openModal(index);

          const img = document.createElement('img');
          img.src = url;
          img.alt = `Gallery image ${index + 1}`;
          img.loading = 'lazy';

          item.appendChild(img);
          galleryEl.appendChild(item);
        });

      } catch (error) {
        console.error('Error loading gallery:', error);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = `Error loading gallery: ${error.message}`;
      }
    }

    function openModal(index) {
      currentImageIndex = index;
      document.getElementById('modalImage').src = imageUrls[index];
      document.getElementById('imageModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    function nextImage() {
      currentImageIndex = (currentImageIndex + 1) % imageUrls.length;
      document.getElementById('modalImage').src = imageUrls[currentImageIndex];
    }

    function previousImage() {
      currentImageIndex = (currentImageIndex - 1 + imageUrls.length) % imageUrls.length;
      document.getElementById('modalImage').src = imageUrls[currentImageIndex];
    }

    // Keyboard navigation for modal
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('imageModal').classList.contains('active')) {
        if (e.key === 'ArrowRight') nextImage();
        if (e.key === 'ArrowLeft') previousImage();
        if (e.key === 'Escape') closeModal();
      }
    });

    // Close modal when clicking outside the image
    document.getElementById('imageModal').addEventListener('click', (e) => {
      if (e.target.id === 'imageModal') {
        closeModal();
      }
    });

    // Load gallery on page load
    document.addEventListener('DOMContentLoaded', loadGallery);
  </script>
</body>
</html>
